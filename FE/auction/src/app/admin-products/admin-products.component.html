<app-navbar />

<div class="admin-products-page">
  <div class="page-header">
    <h1>Admin — All Products</h1>
  </div>

  <app-product-toolbar
    [query]="query()"
    [statusFilter]="statusFilter()"
    [sort]="sort()"
    [showAddButton]="false"
    [showExport]="false"
    [showImport]="false"
    [statusOptions]="['All', 'Active', 'Draft']"
    (queryChange)="query.set($event)"
    (statusFilterChange)="statusFilter.set($any($event))"
    (sortChange)="sort.set($any($event))"
  />

  @if (loading()) {
    <p class="state-msg">Loading products...</p>
  } @else if (error()) {
    <p class="state-msg error">{{ error() }}</p>
  } @else if (filtered().length === 0) {
    <p class="state-msg">No products found.</p>
  } @else {
    <app-product-table
      [products]="filtered()"
      [selectedIds]="selectedIds()"
      [showDeleteButton]="true"
      (selectionChange)="onSelectionChange($event)"
      (deleteClick)="onDeleteProduct($event)"
      (acceptClick)="onAcceptProduct($event)"
    />
  }

  <app-reject-modal
    [show]="showRejectModal()"
    [productName]="pendingDeleteProduct()?.name ?? ''"
    (confirm)="onRejectConfirmed($event)"
    (cancel)="onRejectCancelled()"
  />
</div>
