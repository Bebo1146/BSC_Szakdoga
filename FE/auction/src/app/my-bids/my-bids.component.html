<div class="app">
  <app-navbar></app-navbar>

  <main class="page">
    <h1>My Bids</h1>

    <!-- If you render a list of bids, link each item to the payments page:
         [routerLink]="['/payments']" [queryParams]="{ bidId: bid.id }" -->
    
    <app-product-toolbar
      [query]="query()"
      [statusFilter]="statusFilter()"
      [sort]="sort()"
      [showAddButton]="false"
      [statusOptions]="['All', 'Active', 'Sold', 'Expired']"
      searchPlaceholder="Search my bids..."
      (queryChange)="query.set($event)"
      (statusFilterChange)="statusFilter.set($any($event))"
      (sortChange)="sort.set($any($event))"
    ></app-product-toolbar>

    <app-product-table
      [products]="filtered()"
      [selectedIds]="selectedIds()"
      [loading]="loading()"
      [error]="error()"
      [showPay]="true"
      [showFeedback]="true"
      (selectionChange)="onSelectionChange($event)"
      (productClick)="onProductClick($event)"
      (feedbackClick)="onFeedbackClick($event)"
      (bidUpdated)="onBidUpdated($event)"
    ></app-product-table>
  </main>
</div>
