<header class="topbar">
  <div class="brand">
    <div class="logo">LOGO</div>
  </div>

  <nav class="nav">
    <a class="link" routerLink="/home" routerLinkActive="active">Home</a>
    <a class="link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Products</a>
    <a class="link" routerLink="/store-settings" routerLinkActive="active">Store setting</a>
    <a class="link" routerLink="/support" routerLinkActive="active">Support</a>
  </nav>

  <div class="top-actions">
    <button class="icon-btn" title="Notifications">🔔</button>
    <button class="icon-btn" title="Settings">⚙️</button>
    <div class="store">
      <div class="avatar">S</div>
      <div class="store-name">{{ storeName }}</div>
      <div class="caret">▾</div>
    </div>
  </div>
</header>
