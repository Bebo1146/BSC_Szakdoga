<header class="topbar">
  <div class="brand">
    <div class="logo">LOGO</div>
  </div>

  <nav class="nav">
    <a class="link" routerLink="/my-bids" routerLinkActive="active">My Bids</a>
    <a class="link" routerLink="/home" routerLinkActive="active">My Products</a>
    <a class="link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Products</a>
    <!-- <a class="link" routerLink="/store-settings" routerLinkActive="active">Store setting</a> -->
    <a class="link" routerLink="/feedbacks" routerLinkActive="active">Reviews About Me</a>
  </nav>

  <div class="top-actions">
    <button 
      class="icon-btn theme-toggle" 
      (click)="toggleTheme()" 
      [title]="themeService.isDarkMode() ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
    >
      {{ themeService.isDarkMode() ? '☀️' : '🌙' }}
    </button>
    <div class="store">
      <div class="store-name">{{ storeName }}</div>
    </div>
  </div>
</header>
