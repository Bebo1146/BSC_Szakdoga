<div class="login-container">
  <form class="login-form"><!-- removed (ngSubmit) to avoid native submit when FormsModule isn't imported -->
    <h2>Sign In</h2>
    <p class="subtitle">Continue with Keycloak</p>

    <!-- changed to type="button" and use (click) to avoid full page refresh -->
    <button type="button" (click)="onSubmit()">Login with Keycloak</button>

    <div class="error" *ngIf="error">{{ error }}</div>
  </form>
</div>
