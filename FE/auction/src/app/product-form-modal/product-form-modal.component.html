<div class="modal-overlay" *ngIf="show" (click)="onClose()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ title }}</h2>
      <button class="modal-close" (click)="onClose()">&times;</button>
    </div>

    <div class="modal-body">
      <div class="form-group">
        <label for="prod-name">Name *</label>
        <input
          id="prod-name"
          type="text"
          placeholder="Product name"
          [ngModel]="product.name"
          (ngModelChange)="updateField('name', $event)"
        />
      </div>

      <div class="form-group">
        <label for="prod-description">Description</label>
        <textarea
          id="prod-description"
          placeholder="Describe your product..."
          rows="3"
          [ngModel]="product.description"
          (ngModelChange)="updateField('description', $event)"
        ></textarea>
      </div>

      <div class="form-group">
        <label for="prod-category">Category *</label>
        <input
          id="prod-category"
          type="text"
          placeholder="e.g. Electronics, Fashion, Art"
          [ngModel]="product.category"
          (ngModelChange)="updateField('category', $event)"
        />
      </div>

      <div class="form-group">
        <label for="prod-image">Image URL</label>
        <input
          id="prod-image"
          type="text"
          placeholder="https://example.com/image.jpg"
          [ngModel]="product.imageUrl"
          (ngModelChange)="updateField('imageUrl', $event)"
        />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="prod-starting-price">Starting Price ($) *</label>
          <input
            id="prod-starting-price"
            type="number"
            min="0.01"
            step="0.01"
            placeholder="0.00"
            [ngModel]="product.startingPrice"
            (ngModelChange)="updateField('startingPrice', +$event)"
          />
        </div>

        <div class="form-group">
          <label for="prod-reserve-price">Reserve Price ($)</label>
          <input
            id="prod-reserve-price"
            type="number"
            min="0"
            step="0.01"
            placeholder="Optional"
            [ngModel]="product.reservePrice"
            (ngModelChange)="updateField('reservePrice', $event ? +$event : null)"
          />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="prod-start-time">Auction Start</label>
          <input
            id="prod-start-time"
            type="datetime-local"
            [ngModel]="product.auctionStartTime"
            (ngModelChange)="updateField('auctionStartTime', $event)"
          />
        </div>

        <div class="form-group">
          <label for="prod-end-time">Auction End</label>
          <input
            id="prod-end-time"
            type="datetime-local"
            [ngModel]="product.auctionEndTime"
            (ngModelChange)="updateField('auctionEndTime', $event)"
          />
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="ghost" (click)="onClose()">Cancel</button>
      <button class="primary" (click)="onSave()" [disabled]="saving">
        {{ saving ? 'Saving...' : submitButtonText }}
      </button>
    </div>
  </div>
</div>
