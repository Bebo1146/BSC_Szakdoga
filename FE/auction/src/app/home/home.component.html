<div class="app">
  <!-- Top bar -->
  <app-navbar></app-navbar>

  <!-- Page -->
  <main class="page">
    <h1>My Products</h1>

    <app-product-toolbar
      [query]="query()"
      [statusFilter]="statusFilter()"
      [sort]="sort()"
      searchPlaceholder="Search my products..."
      (queryChange)="query.set($event)"
      (statusFilterChange)="statusFilter.set($event)"
      (sortChange)="sort.set($event)"
      (addProduct)="onAddProduct()"
    ></app-product-toolbar>

    <app-product-table
      [products]="filtered()"
      [selectedIds]="selectedIds()"
      [loading]="loading()"
      [error]="error()"
      (selectionChange)="onSelectionChange($event)"
    ></app-product-table>
  </main>
</div>

<app-product-form-modal
  [show]="showAddModal()"
  [saving]="saving()"
  [product]="newProduct()"
  title="Add Product"
  submitButtonText="Add Product"
  (close)="closeModal()"
  (save)="saveProduct()"
  (productChange)="onProductChange($event)"
></app-product-form-modal>
