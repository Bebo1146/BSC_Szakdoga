<section class="toolbar">
  <div class="search">
    <span class="search-ic">🔎</span>
    <input
      type="text"
      [placeholder]="searchPlaceholder"
      [ngModel]="query"
      (ngModelChange)="onQueryChange($event)"
    />
  </div>

  <div class="selects">
    <select *ngIf="showStatusSelect" (change)="onStatusFilterChange($any($event.target).value)">
      <option
        *ngFor="let opt of statusOptions"
        [value]="opt"
        [selected]="statusFilter === opt"
      >
        {{ opt }}
      </option>
    </select>

    <select (change)="sortChange.emit($any($event.target).value)">
      <option value="Newest" [selected]="sort === 'Newest'">Newest</option>
      <option value="Name A-Z" [selected]="sort === 'Name A-Z'">Name A-Z</option>
      <option value="Ending Soon" [selected]="sort === 'Ending Soon'">Ending Soon</option>
      <option value="Most Bids" [selected]="sort === 'Most Bids'">Most Bids</option>
    </select>
  </div>

  <div class="spacer"></div>

  <div class="toolbar-actions">
    <button class="primary" *ngIf="showAddButton" (click)="onAddProduct()">{{ addButtonText }}</button>
  </div>
</section>
