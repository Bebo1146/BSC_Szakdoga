services:
  # ─── Infrastructure ───
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloakpass
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - app-network

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command:
      - start-dev
      - --import-realm
      - --spi-theme-cache-themes=false
      - --spi-theme-cache-templates=false
      - --spi-theme-static-max-age=-1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloakpass
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_URL: http://localhost:8080
      KC_HOSTNAME_ADMIN_URL: http://localhost:8080
    ports:
      - "8080:8080"
    volumes:
      - ./themes:/opt/keycloak/themes
      - ./realm-export/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3;if [ $? -eq 0 ]; then echo 'Healthcheck Successful';exit 0;else echo 'Healthcheck Failed';exit 1;fi;"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - app-network

  # ─── ServicesHoster (Products API + Auction Hub) ───
  services-hoster:
    build:
      context: ./OAuthStart
      dockerfile: ServicesHoster/Dockerfile
    ports:
      - "5124:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Auth__Authority=http://keycloak:8080/realms/dev-realm
      - Auth__ValidIssuer=http://localhost:8080/realms/dev-realm
      - Auth__RequireHttpsMetadata=false
      - Storage__Type=Postgres
      - ConnectionStrings__AuctionDb=Host=postgres;Port=5432;Database=auctiondb;Username=keycloak;Password=keycloakpass
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - app-network

  # ─── OAuthCodeFlowService (BFF / Auth proxy) ───
  oauth-service:
    build:
      context: ./OAuthStart
      dockerfile: OAuthCodeFlowService/Dockerfile
    ports:
      - "5215:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - OAuth__Issuer=http://localhost:8080/realms/dev-realm
      - OAuth__InternalIssuer=http://keycloak:8080/realms/dev-realm
      - OAuth__ClientId=my-backend-client
      - OAuth__ClientSecret=F55vBXMCgtYVLxtn6OD0prfXxqYopaef
      - OAuth__RedirectUri=https://localhost:4443/api/auth/callback
      - OAuth__PostLogoutRedirectUri=https://localhost:4443
      - Services__ProductsApiBase=http://services-hoster:8080/api/products
      - Services__AuctionHubUrl=http://services-hoster:8080/hubs/auction
      - Cors__AllowedOrigins__0=https://localhost:4443
      - Cors__AllowedOrigins__1=http://localhost:4200
    depends_on:
      keycloak:
        condition: service_healthy
      services-hoster:
        condition: service_started
    networks:
      - app-network

  # ─── Payments (Fake payment service) ───
  payments:
    build:
      context: ./OAuthStart
      dockerfile: Payments/Dockerfile
    ports:
      - "5232:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    networks:
      - app-network

  # ─── Angular Frontend (Nginx + HTTPS) ───
  frontend:
    build:
      context: ../FE/auction
      dockerfile: Dockerfile
    ports:
      - "4443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - oauth-service
      - payments
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge