services:
  # ─── Infrastructure ───
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloakpass
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    command:
      - start-dev
      - --spi-theme-cache-themes=false
      - --spi-theme-cache-templates=false
      - --spi-theme-static-max-age=-1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloakpass
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_URL: http://localhost:8080
      KC_HOSTNAME_ADMIN_URL: http://localhost:8080
    ports:
      - "8080:8080"
    volumes:
      - ./themes:/opt/keycloak/themes
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3;if [ $? -eq 0 ]; then echo 'Healthcheck Successful';exit 0;else echo 'Healthcheck Failed';exit 1;fi;"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - app-network

  # ─── ServicesHoster (Products API + Auction Hub) ───
  services-hoster:
    build:
      context: ./OAuthStart
      dockerfile: ServicesHoster/Dockerfile
    ports:
      - "5124:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Auth__Authority=http://keycloak:8080/realms/dev-realm
      - Auth__ValidIssuer=http://localhost:8080/realms/dev-realm
      - Auth__RequireHttpsMetadata=false
      - Storage__Type=InMemory
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - app-network

  # ─── OAuthCodeFlowService (BFF / Auth proxy) ───
  oauth-service:
    build:
      context: ./OAuthStart
      dockerfile: OAuthCodeFlowService/Dockerfile
    ports:
      - "5215:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - OAuth__Issuer=http://localhost:8080/realms/dev-realm
      - OAuth__InternalIssuer=http://keycloak:8080/realms/dev-realm
      - OAuth__ClientId=my-backend-client6
      - OAuth__ClientSecret=4BSQV6aMZACSrcOX3ypkK2UCgTgL8rO8
      - OAuth__RedirectUri=http://localhost:4200/api/auth/callback
      - OAuth__PostLogoutRedirectUri=http://localhost:4200
      - Services__ProductsApiBase=http://services-hoster:8080/api/products
      - Cors__AllowedOrigins__0=http://localhost:4200
      - Cors__AllowedOrigins__1=http://localhost:3000
      - Cors__AllowedOrigins__2=http://localhost:5173
    depends_on:
      keycloak:
        condition: service_healthy
      services-hoster:
        condition: service_started
    networks:
      - app-network

  # ─── Payments (Fake payment service) ───
  payments:
    build:
      context: ./OAuthStart
      dockerfile: Payments/Dockerfile
    ports:
      - "5232:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge