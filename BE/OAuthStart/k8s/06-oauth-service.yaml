apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth-service
  namespace: auction
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth-service
  template:
    metadata:
      labels:
        app: oauth-service
    spec:
      initContainers:
        - name: wait-for-dependencies
          image: busybox:1.36
          imagePullPolicy: Never
          command:
            - sh
            - -c
            - "until nc -z keycloak 8080 && nc -z services-hoster 8080; do echo 'waiting for dependencies...'; sleep 5; done"
      containers:
        - name: oauth-service
          image: oauth-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: oauth-secret
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: OAuth__Issuer
              value: "https://keycloak.local:9443/realms/dev-realm"
            - name: OAuth__InternalIssuer
              value: "http://keycloak:8080/realms/dev-realm"
            - name: OAuth__RedirectUri
              value: "https://auction.local:9443/api/auth/callback"
            - name: OAuth__PostLogoutRedirectUri
              value: "https://auction.local:9443"
            - name: Services__ProductsApiBase
              value: "http://services-hoster:8080/api/products"
            - name: Services__AuctionHubUrl
              value: "http://services-hoster:8080/hubs/auction"
            - name: Cors__AllowedOrigins__0
              value: "https://auction.local:9443"
            - name: Cors__AllowedOrigins__1
              value: "http://localhost:4200"

---
apiVersion: v1
kind: Service
metadata:
  name: oauth-service
  namespace: auction
spec:
  selector:
    app: oauth-service
  ports:
    - port: 8080
      targetPort: 8080