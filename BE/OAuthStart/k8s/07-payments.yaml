apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: auction
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      initContainers:
        - name: wait-for-keycloak
          image: busybox:1.36
          imagePullPolicy: Never
          command:
            - sh
            - -c
            - "until nc -z keycloak 8080; do echo 'waiting for keycloak...'; sleep 5; done"
      containers:
        - name: payments
          image: payments:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
            - name: Auth__Authority
              value: "http://keycloak:8080/realms/dev-realm"
            - name: Auth__ValidIssuer
              value: "https://keycloak.local:9443/realms/dev-realm"
            - name: Auth__RequireHttpsMetadata
              value: "false"

---
apiVersion: v1
kind: Service
metadata:
  name: payments
  namespace: auction
spec:
  selector:
    app: payments
  ports:
    - port: 8080
      targetPort: 8080