# ??? Postgres init script ???
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-db
  namespace: auction
data:
  init-db.sql: |
    SELECT 'CREATE DATABASE auctiondb OWNER keycloak'
    WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'auctiondb')\gexec

---
# ??? Frontend Nginx config (HTTP only — TLS terminates at Ingress) ???
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-conf
  namespace: auction
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/auth {
            proxy_pass http://oauth-service:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/BffProxy {
            proxy_pass http://oauth-service:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/payments {
            proxy_pass http://payments:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /hubs {
            proxy_pass http://oauth-service:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }
    }