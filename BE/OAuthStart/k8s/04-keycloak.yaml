apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: auction
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          imagePullPolicy: Never
          command:
            - sh
            - -c
            - "until nc -z postgres 5432; do echo 'waiting for postgres...'; sleep 2; done"
      containers:
        - name: keycloak
          image: keycloak-custom:local
          imagePullPolicy: Never
          args:
            - start-dev
            - --import-realm
            - --spi-theme-cache-themes=false
            - --spi-theme-cache-templates=false
            - --spi-theme-static-max-age=-1
            - --health-enabled=true
          ports:
            - containerPort: 8080
            - containerPort: 9000
          envFrom:
            - secretRef:
                name: keycloak-secret
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL_HOST
              value: postgres
            - name: KC_DB_URL_DATABASE
              value: keycloak
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HOSTNAME_URL
              value: "http://keycloak.local:9080"
            - name: KC_HOSTNAME_ADMIN_URL
              value: "http://keycloak.local:9080"
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
          startupProbe:
            httpGet:
              path: /health/ready
              port: 9000
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: 9000
            periodSeconds: 30
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm-export

---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: auction
spec:
  selector:
    app: keycloak
  ports:
    - port: 8080
      targetPort: 8080